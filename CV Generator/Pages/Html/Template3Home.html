<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/Pages/Images/Lasticon.jpeg"  >
        <title>CV/Resume Generator</title>
        <!-- Bootstrap & CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <!-- FontAwesome for icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="/Pages/CSS/loadingscreen.css">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
        <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
        <style>
          #live-preview {
              width: 100%;
              height: auto;
              overflow: visible;
          }

        </style>
    </head>
    
    <body>
        <div id="progress-bar"></div>
    <div id="progress-bar-validation"></div>
    <div id="loading-overlay"></div>
        <header class="py-1 bg-light">
            <div class="container-fluid">
              <div class="row align-items-center">
                <!-- Left Section -->
                <div class="col-lg-5">
                  <a href="/cv/home" class="text-warning text-decoration-none">
                    <img src="/Pages/Images/PIC.jpeg" class="mb-0 img-fluid" style="width: 170px; height: 55px;">
        
                  </a>
                </div>
        
                <!-- Right Section -->
                <div class="col-lg-7">
                  
                </div>
              </div>
            </div>
          </header>
        <div class="container my-5">
            <div class="row">
                <!-- Input Section -->
                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="mb-4">Add Your Information</h4>
                            <!-- Basic Information -->
                            <form id="basic-info" oninput="updatePreview()">
                                <div class="mb-3">
                                    <label for="fullName" class="form-label"
                                        >Full Name</label
                                    >
                                    <input
                                        type="text"
                                        id="fullName"
                                        class="form-control"
                                        placeholder="Enter your full name"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="profileImage" class="form-label">Upload Profile Image</label>
                                    <input
                                        type="file"
                                        id="profileImage"
                                        class="form-control"
                                        accept="image/*"
                                        onchange="previewImage(event)" />
                                    <img id="profileImagePreview" src="" alt="Profile Image Preview" class="img-fluid mt-3" style="display: none; width: 150px; height: 150px; object-fit: cover;" />
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label"
                                        >Phone Number</label
                                    >
                                    <input
                                        type="tel"
                                        id="phoneNumber"
                                        class="form-control"
                                        placeholder="Enter your phone number"
                                        required
                                    />
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label"
                                        >Email</label
                                    >
                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="address" class="form-label"
                                        >Address</label
                                    >
                                    <input
                                        type="text"
                                        id="address"
                                        class="form-control"
                                        placeholder="Enter your address"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="Linkedin" class="form-label"
                                        >Linkedin</label
                                    >
                                    <input
                                        type="text"
                                        id="Linkedin"
                                        class="form-control"
                                        placeholder="Enter your Linkedin"
                                        required
                                    />
                                </div>
                                
                                
                            </form>
                            <hr />
                            <!-- Dynamic Form Section (Initially Empty) -->
                            <div id="dynamic-form" class="mt-4"></div>

                            <!-- Vertical Buttons -->
                            <h5 class="mt-4">Add More Details</h5>
                            <div class="d-flex flex-column">
                                <button
                                    class="btn btn-outline-success mb-2"
                                    onclick="showForm('profile')"
                                >
                                    <i class="fas fa-user-circle me-2"></i>
                                    Profile
                                </button>

                                <button
                                    class="btn btn-outline-info mb-2"
                                    onclick="showForm('education')"
                                >
                                    <i class="fas fa-graduation-cap me-2"></i
                                    >Education
                                </button>

                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('workExperience')"
                                >
                                    <i class="fas fa-briefcase me-2"></i>
                                    Work Experience
                                </button>


                                <button
                                    class="btn btn-outline-warning mb-2"
                                    onclick="showForm('techskills')"
                                >
                                    <i class="fas fa-tools me-2"></i> Technical Skills
                                </button>


                                <button
                                    class="btn btn-outline-warning mb-2"
                                    onclick="showForm('softskills')"
                                >
                                    <i class="fas fa-tools me-2"></i>Soft Skills
                                </button>

                                
                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('languages')"
                                >
                                    <i class="fas fa-language me-2"></i
                                    >Languages
                                </button>


                                <button
                                    class="btn btn-outline-success"
                                        onclick="showForm('references')"
                                    >
                                        <i class="fas fa-reference me-2"></i>
                                        Reference
                                </button>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Preview Section -->
                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="text-center mb-4">
                                Live CV/Resume Preview
                            </h4>
                            <hr>
                            <div id="live-preview" class="text-muted">
                                <p class="text-center">
                                    Your CV will appear here as you add
                                    information.
                                </p>
                            </div>
                            <div class="text-center mt-4">
                              <button class="btn btn-success" onclick="exportToPDF()">Download as PDF</button>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        
        <!-- Bootstrap and JS file -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
        <script src="/Pages/Javascripts/Template3Home.js"></script>
        <script src="/Pages/Javascripts/LoadingScreen.js"></script>
        <script src="/Pages/Javascripts/GeneratePdf.js"></script>
       
    </body>
</html>
