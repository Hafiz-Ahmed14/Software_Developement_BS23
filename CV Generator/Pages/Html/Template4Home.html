<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CV/Resume Generator</title>
        <!-- Bootstrap & CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <!-- FontAwesome for icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
        <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
        <style>
          #live-preview {
              width: 100%;
              height: auto;
              overflow: visible;
          }
        </style>
    </head>
    
    <body>
        <header class="bg-primary text-white py-1">
            <h1 class="text-center">
                <a href="/cv/home" class="text-white text-decoration-none"
                    >Online CV/Resume Generator</a
                >
            </h1>
        </header>
        <div class="container my-5">
            <div class="row">
                <!-- Input Section -->
                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="mb-4">Add Your Information</h4>
                            <!-- Basic Information -->
                            <form id="basic-info" oninput="updatePreview()">
                                <div class="mb-3">
                                    <label for="fullName" class="form-label"
                                        >Full Name</label
                                    >
                                    <input
                                        type="text"
                                        id="fullName"
                                        class="form-control"
                                        placeholder="Enter your full name"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="desig" class="form-label"
                                        >Designation</label
                                    >
                                    <input
                                        type="text"
                                        id="desig"
                                        class="form-control"
                                        placeholder="Enter your Designation"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="profileImage" class="form-label">Upload Profile Image</label>
                                    <input
                                        type="file"
                                        id="profileImage"
                                        class="form-control"
                                        accept="image/*"
                                        onchange="previewImage(event)" />
                                    <img id="profileImagePreview" src="" alt="Profile Image Preview" class="img-fluid mt-3" style="display: none; width: 150px; height: 150px; object-fit: cover;" />
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label"
                                        >Phone Number</label
                                    >
                                    <input
                                        type="tel"
                                        id="phoneNumber"
                                        class="form-control"
                                        placeholder="Enter your phone number"
                                        required
                                    />
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label"
                                        >Email</label
                                    >
                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="address" class="form-label"
                                        >Address</label
                                    >
                                    <input
                                        type="text"
                                        id="address"
                                        class="form-control"
                                        placeholder="Enter your address"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="Linkedin" class="form-label"
                                        >Linkedin</label
                                    >
                                    <input
                                        type="text"
                                        id="Linkedin"
                                        class="form-control"
                                        placeholder="Enter your Linkedin"
                                        required
                                    />
                                </div>
                                
                                
                            </form>
                            <hr />
                            <!-- Dynamic Form Section (Initially Empty) -->
                            <div id="dynamic-form" class="mt-4"></div>

                            <!-- Vertical Buttons -->
                            <h5 class="mt-4">Add More Details</h5>
                            <div class="d-flex flex-column">
                                <button
                                    class="btn btn-outline-success mb-2"
                                    onclick="showForm('profile')"
                                >
                                    <i class="fas fa-user-circle me-2"></i>
                                    Profile
                                </button>

                                <button
                                    class="btn btn-outline-info mb-2"
                                    onclick="showForm('education')"
                                >
                                    <i class="fas fa-graduation-cap me-2"></i
                                    >Education
                                </button>
                                
                                <button
                                    class="btn btn-outline-warning mb-2"
                                    onclick="showForm('softskills')"
                                >
                                    <i class="fas fa-tools me-2"></i>Soft Skills
                                </button>


                                <button
                                    class="btn btn-outline-warning mb-2"
                                    onclick="showForm('techskills')"
                                >
                                    <i class="fas fa-tools me-2"></i> Technical Skills
                                </button>


                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('languages')"
                                >
                                    <i class="fas fa-language me-2"></i
                                    >Languages
                                </button>

                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('Projects')"
                                >
                                    <i class="fas fa-briefcase me-2"></i>
                                    PROJECTS
                                </button>

                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('achievementsHackathons')"
                                >
                                    <i class="fas fa-trophy me-2"></i>
                                    ACHIEVEMENTS & HACKATHONS
                                </button>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Preview Section -->
                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="text-center mb-4">
                                Live CV/Resume Preview
                            </h4>
                            <hr>
                            <div id="live-preview" class="text-muted">
                                <p class="text-center">
                                    Your CV will appear here as you add
                                    information.
                                </p>
                            </div>
                            <div class="text-center mt-4">
                              <button class="btn btn-success" onclick="exportToPDF()">Download as PDF</button>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap and JS file -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script src="/Pages/Javascripts/Template4Home.js"></script>

        <script>
            async function exportToPDF() {
                const { jsPDF } = window.jspdf;
        
                // Create a new jsPDF instance
                const pdf = new jsPDF({
                    orientation: 'p',  // Portrait
                    unit: 'mm',
                    format: 'a4',
                    putOnlyUsedFonts: true
                });
        
                const livePreview = document.getElementById('live-preview'); // Your content container
        
                const pageWidth = 210; // A4 width
                const pageHeight = 297; // A4 height
        
                const marginLeft = 15;
                const marginTop = 15;
                const marginRight = 15;
                const marginBottom = 15;
        
                // Calculate usable width and height
                const usableWidth = pageWidth - marginLeft - marginRight;
                const usableHeight = pageHeight - marginTop - marginBottom;
        
                // Scale factor to fit the content into the page width and height
                const scaleX = usableWidth / livePreview.offsetWidth;
                const scaleY = usableHeight / livePreview.offsetHeight;
                const scale = Math.min(scaleX, scaleY); // Scale content to fit within the page
        
                // Start rendering content
                pdf.html(livePreview, {
                    callback: function (doc) {
                        // Save the document as 'cv.pdf' after rendering
                        doc.save('cv.pdf');
                    },
                    x: marginLeft, // Left margin
                    y: marginTop, // Top margin
                    html2canvas: {
                        scale: scale, // Apply the scale for content
                        useCORS: true, // Allow cross-origin images
                        logging: true, // Enable logging for debugging (optional)
                        letterRendering: true // Improve text rendering
                    },
                    autoPaging: true // Enable automatic pagination
                });
            }
        </script>
            
    </body>
</html>
