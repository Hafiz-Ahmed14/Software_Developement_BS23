<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex: 1;
      }
      .card {
        width: 100%;
        max-width: 350px;
        margin-top: 20px;
        padding: 1.5rem;
      }
      footer {
        margin-top: auto;
      }
      .form-label {
        font-size: 0.9rem;
      }
      .form-control {
        font-size: 0.9rem;
      }
      .btn {
        font-size: 0.9rem;
      }
      h2 {
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header class="bg-primary text-white py-3">
      <h1 class="text-center">
        <a href="/cv/home" class="text-white text-decoration-none">
          CV/Resume Generator
        </a>
      </h1>
    </header>

    <!-- Main Content -->
    <main class="container d-flex justify-content-center align-items-center">
      <div class="card shadow">
        <!-- Logo -->
        <div class="text-center">
          <img
            src="/Pages/Images/logo.png"
            alt="Logo"
            class="rectangle mb-3"
            style="width: 80px; height: 80px"
          />
        </div>
        <hr />
        <!-- Login Page Text -->
        <h2 class="text-center mb-3">Login Page</h2>
        <!-- Login Form -->
        <form id="loginForm">
          <div class="mb-3">
            <label for="emailOrUsername" class="form-label">
              Email or Username
            </label>
            <input
              type="email"
              class="form-control"
              id="emailOrUsername"
              placeholder="Enter your email or username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none text-primary">
            Forgot Password?
          </a>
        </div>

        <div class="text-center mt-4">
          <span>Not have an account?</span>
          <a href="/cv/register" class="text-decoration-none text-primary">
            Sign Up
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-3">
      <p class="text-center mb-0">
        © 2025 CV/Resume Generator. All Rights Reserved.
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const emailOrUsername = document.getElementById('emailOrUsername').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/cv/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ emailOrUsername, password }),
        });

        if (response.ok) {
          alert('Login successful!');
          window.location.href = '/cv/generatecv';
        } else {
          const errorData = await response.json();
          alert(`Login failed: ${errorData.message}`);
        }
      });
    </script>
  </body>
</html>
