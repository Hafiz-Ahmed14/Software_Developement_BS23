        <!-- Logo -->

          <img

        <hr />
        <!-- Login Page Text -->

        <!-- Login Form -->
        <form id="loginForm">
          <div class="mb-3">
            <label for="emailOrUsername" class="form-label">
              Email or Username
            </label>
            <input
              type="text"
              class="form-control"
              id="emailOrUsername"
              placeholder="Enter your email or username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <a href="/cv/forgotpassword" class="text-decoration-none text-primary">
            Forgot Password?
          </a>
        </div>

        <div class="text-center mt-4">
          <span>Not have an account?</span>
          <a href="/cv/register" class="text-decoration-none text-primary">
            Sign Up
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-3">
      <p class="text-center mb-0">
        © 2025 CV/Resume Generator. All Rights Reserved.
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault(); // Prevent form submission

        // Get input values and trim whitespace
        const usernameOrEmail = document.getElementById('emailOrUsername').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!usernameOrEmail || !password) {
            alert("Please enter both username/email and password.");
            return;
        }

        // Create login request payload
        const loginData = {
            username: usernameOrEmail,  // Match backend expected field names (lowercase)
            password: password
        };

        try {
            const response = await fetch('/cv/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData),
            });
            if (!response.ok) {
                let errorMessage = "Login failed. Please try again.";
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.error || errorData.message || errorMessage;
                } catch (err) {
                    console.error("Error parsing error response:", err);
                }
                alert(errorMessage);
                return;
            }

            // Successful login
            const data = await response.json();
            localStorage.setItem("loggedInUser", data.username);
            alert("Login successful!");
            window.location.href = "/cv/UserHome";  // Redirect after login

        } catch (error) {
            console.error("An error occurred during login:", error);
            alert("An unexpected error occurred. Please try again later.");
        }
    });

    </script>
  </body>
