<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex: 1;
      }
      .card {
        width: 100%;
        max-width: 350px; /* Reduced box width */
        margin-top: 20px; /* Reduced margin-top */
        padding: 1.5rem; /* Reduced padding */
      }
      footer {
        margin-top: auto;
      }
      /* Scale down the font size */
      .form-label {
        font-size: 0.9rem;
      }
      .form-control {
        font-size: 0.9rem;
      }
      .btn {
        font-size: 0.9rem;
      }
      h2 {
        font-size: 1.5rem; /* Reduced font size for title */
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header class="bg-primary text-white py-3">
      <h1 class="text-center">
        <a href="home.html" class="text-white text-decoration-none"
          >CV/Resume Generator</a
        >
      </h1>
    </header>

    <!-- Main Content -->
    <main class="container d-flex justify-content-center align-items-center">
      <div class="card shadow">
        <!-- Logo -->
        <div class="text-center">
          <img
            src="Pages/Images/logo.png"
            alt="Logo"
            class="rectangle mb-3"
            style="width: 80px; height: 80px"
          />
        </div>
        <hr />
        <!-- Login Page Text -->
        <h2 class="text-center mb-3">Login Page</h2>
        <!-- Login Form -->
        <form>
          <!-- Email/Username Input -->
          <div class="mb-3">
            <label for="emailOrUsername" class="form-label"
              >Email or Username</label
            >
            <input
              type="email"
              class="form-control"
              id="emailOrUsername"
              placeholder="Enter your email or username"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <!-- Login Button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <!-- Additional Links -->
        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none text-primary"
            >Forgot Password?</a
          >
        </div>

        <!-- Signup Option -->
        <div class="text-center mt-4">
          <span>Not have an account?</span>
          <a href="Register.html" class="text-decoration-none text-primary"
            >Sign Up</a
          >
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-3">
      <p class="text-center mb-0">
        © 2025 CV/Resume Generator. All Rights Reserved.
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
