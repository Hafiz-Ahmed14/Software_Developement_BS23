<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/Pages/Images/Lasticon.jpeg"  >
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Pages/CSS/login.css">
    <link rel="stylesheet" href="/Pages/CSS/loadingscreen.css">

  </head>
  <body class="bg-light">
    <div id="progress-bar"></div>
    <div id="progress-bar-validation"></div>
    <div id="loading-overlay"></div>
    <!-- Header -->
    <header class="py-1 fixed-top bg-light">
      <div class="container-fluid">
        <div class="row align-items-center">
          <!-- Left Section -->
          <div class="col-lg-5">
            <a href="/cv/home" class="text-warning text-decoration-none">
              <img src="/Pages/Images/PIC.jpeg" class="mb-0 img-fluid" style="width: 170px; height: 55px;">
  
            </a>
          </div>
  
          <!-- Right Section -->
          <div class="col-lg-7">
            
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container d-flex justify-content-center align-items-center">
      <div class="card shadow">
        <!-- Logo -->
        <div class="text-center">
          <img
            src="/Pages/Images/Lasticon.jpeg"
            alt="Logo"
            class="rectangle mb-3"
            style="width: 80px; height: 80px"
          />
        </div>
        <hr />
        <!-- Login Page Text -->
        <h2 class="text-center mb-3">Login Page</h2>
        <div id="notification" class="notification"></div>
        <!-- Login Form -->
        <form id="loginForm">
          <div class="mb-3">
            <label for="emailOrUsername" class="form-label">
              Email or Username
            </label>
            <input
              type="text"
              class="form-control"
              id="emailOrUsername"
              placeholder="Enter your email or username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <a href="/cv/forgotpassword" class="text-decoration-none text-primary">
            Forgot Password?
          </a>
        </div>

        <div class="text-center mt-4">
          <span>Not have an account?</span>
          <a href="/cv/register" class="text-decoration-none text-primary">
            Sign Up
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-3">
      <p class="text-center mb-0">
        © 2025 CV/Resume Generator. All Rights Reserved.
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Pages/Javascripts/LoadingScreen.js"></script>
    <script src="/Pages/Javascripts/login.js"> </script>
      
  </body>
</html>
