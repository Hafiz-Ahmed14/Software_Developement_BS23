<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CV/Resume Generator</title>
        <!-- Bootstrap & CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <!-- FontAwesome for icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
        <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
        <style>
          #live-preview {
              width: 100%;
              height: auto;
              overflow: visible;
          }
        </style>
    </head>
    
    <body>
        <header class="bg-primary text-white py-1">
            <h1 class="text-center">
                <a href="home.html" class="text-white text-decoration-none"
                    >Online CV/Resume Generator</a
                >
            </h1>
        </header>
        <div class="container my-5">
            <div class="row">
                <!-- Input Section -->
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="mb-4">Add Your Information</h4>
                            <!-- Basic Information -->
                            <form id="basic-info" oninput="updatePreview()">
                                <div class="mb-3">
                                    <label for="fullName" class="form-label"
                                        >Full Name</label
                                    >
                                    <input
                                        type="text"
                                        id="fullName"
                                        class="form-control"
                                        placeholder="Enter your full name"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label for="address" class="form-label"
                                        >Address</label
                                    >
                                    <input
                                        type="text"
                                        id="address"
                                        class="form-control"
                                        placeholder="Enter your address"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label"
                                        >Phone Number</label
                                    >
                                    <input
                                        type="tel"
                                        id="phoneNumber"
                                        class="form-control"
                                        placeholder="Enter your phone number"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label"
                                        >Email</label
                                    >
                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required
                                    />
                                </div>
                            </form>
                            <hr />
                            <!-- Dynamic Form Section (Initially Empty) -->
                            <div id="dynamic-form" class="mt-4"></div>

                            <!-- Vertical Buttons -->
                            <h5 class="mt-4">Add More Details</h5>
                            <div class="d-flex flex-column">
                                <button
                                    class="btn btn-outline-primary mb-2"
                                    onclick="showForm('personalDetails')"
                                >
                                    <i class="fas fa-user me-2"></i>Personal
                                    Details
                                </button>
                                <button
                                    class="btn btn-outline-success mb-2"
                                    onclick="showForm('education')"
                                >
                                    <i class="fas fa-graduation-cap me-2"></i
                                    >Education
                                </button>
                                <button
                                    class="btn btn-outline-warning mb-2"
                                    onclick="showForm('skills')"
                                >
                                    <i class="fas fa-tools me-2"></i>Skills
                                </button>
                                <button
                                    class="btn btn-outline-danger mb-2"
                                    onclick="showForm('certificates')"
                                >
                                    <i class="fas fa-certificate me-2"></i
                                    >Certificates
                                </button>
                                <button
                                    class="btn btn-outline-info"
                                    onclick="showForm('languages')"
                                >
                                    <i class="fas fa-language me-2"></i
                                    >Languages
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Live Preview Section -->
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="text-center mb-4">
                                Live CV/Resume Preview
                            </h4>
                            <hr>
                            <div id="live-preview" class="text-muted">
                                <p class="text-center">
                                    Your CV will appear here as you add
                                    information.
                                </p>
                            </div>
                            <div class="text-center mt-4">
                              <button class="btn btn-success" onclick="exportToPDF()">Download as PDF</button>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap and JS file -->
        
        <script>
            const formTemplates = {
                personalDetails: `
                    <div id="personalDetails">
                        <h5>Personal Details</h5>
                        <form>
                            <div class="mb-3">
                                <label for="fatherName" class="form-label">Father's Name</label>
                                <input type="text" id="fatherName" class="form-control" placeholder="Enter father's name" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="motherName" class="form-label">Mother's Name</label>
                                <input type="text" id="motherName" class="form-control" placeholder="Enter mother's name" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" id="dob" class="form-control" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="gender" class="form-label">Gender</label>
                                <input type="text" id="gender" class="form-control" placeholder="Enter gender" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="maritalStatus" class="form-label">Marital Status</label>
                                <input type="text" id="maritalStatus" class="form-control" placeholder="Enter marital status" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="nationality" class="form-label">Nationality</label>
                                <input type="text" id="nationality" class="form-control" placeholder="Enter nationality" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="religion" class="form-label">Religion</label>
                                <input type="text" id="religion" class="form-control" placeholder="Enter religion" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="permanentAddress" class="form-label">Permanent Address</label>
                                <input type="text" id="permanentAddress" class="form-control" placeholder="Enter permanent address" oninput="updatePreview()">
                            </div>
                        </form>
                    </div>
                `,
                education: `
                    <div id='education'> 
                        <h5>Education</h5>
                        <form>
                            <div class="mb-3">
                                <label for="degree" class="form-label">Degree</label>
                                <input type="text" id="degree" class="form-control" placeholder="e.g., BSc in Computer Science" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="institution" class="form-label">Institution</label>
                                <input type="text" id="institution" class="form-control" placeholder="Institution name" oninput="updatePreview()">
                            </div>
                        </form>
                    </div>
                `,
                skills: `
                    <div id='skills'>
                        <h5>Skills</h5>
                        <form>
                            <div class="mb-3">
                                <label for="skillName" class="form-label">Skill</label>
                                <input type="text" id="skillName" class="form-control" placeholder="e.g., JavaScript, Python" oninput="updatePreview()">
                            </div>
                        </form>
                    </div>
                `,
                certificates: `
                    <div id='certificates'>
                        <h5>Certificates</h5>
                        <form>
                            <div class="mb-3">
                                <label for="certificateName" class="form-label">Certificate Name</label>
                                <input type="text" id="certificateName" class="form-control" placeholder="Certificate name" oninput="updatePreview()">
                            </div>
                        </form>
                    </div>
                `,
                languages: `
                    <div id='languages'>
                        <h5>Languages</h5>
                        <form>
                            <div class="mb-3">
                                <label for="languageName" class="form-label">Language</label>
                                <input type="text" id="languageName" class="form-control" placeholder="Language name" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="languageReading" class="form-label">Reading</label>
                                <input type="text" id="languageReading" class="form-control" placeholder="Reading level (e.g., Low, Medium, High)" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="languageWriting" class="form-label">Writing</label>
                                <input type="text" id="languageWriting" class="form-control" placeholder="Writing level (e.g., Low, Medium, High)" oninput="updatePreview()">
                            </div>
                            <div class="mb-3">
                                <label for="languageSpeaking" class="form-label">Speaking</label>
                                <input type="text" id="languageSpeaking" class="form-control" placeholder="Speaking level (e.g., Low, Medium, High)" oninput="updatePreview()">
                            </div>
                        </form>
                    </div>
                `,
            };
        
            let visited_sections = [];
        
            function showForm(section) {
                const dynamicFormContainer = document.getElementById('dynamic-form');
        
                if (!visited_sections.includes(section)) {
                    dynamicFormContainer.insertAdjacentHTML('beforeend', formTemplates[section]);
                }
        
                Object.keys(formTemplates).forEach((item) => {
                    const element = document.querySelector(`#${item}`);
                    if (element) {
                        element.style.display = 'none';
                    }
                });
        
                const element = document.querySelector(`#${section}`);
                element.style.display = 'block';
        
                visited_sections.push(section);
            }
        
            function getData() {
                // Personal Details
                const fatherName = document.getElementById('fatherName') ? document.getElementById('fatherName').value : '';
                const motherName = document.getElementById('motherName') ? document.getElementById('motherName').value : '';
                const dob = document.getElementById('dob') ? document.getElementById('dob').value : '';
                const gender = document.getElementById('gender') ? document.getElementById('gender').value : '';
                const maritalStatus = document.getElementById('maritalStatus') ? document.getElementById('maritalStatus').value : '';
                const nationality = document.getElementById('nationality') ? document.getElementById('nationality').value : '';
                const religion = document.getElementById('religion') ? document.getElementById('religion').value : '';
                const permanentAddress = document.getElementById('permanentAddress') ? document.getElementById('permanentAddress').value : '';
        
                // Education
                const degree = document.getElementById('degree') ? document.getElementById('degree').value : '';
                const institution = document.getElementById('institution') ? document.getElementById('institution').value : '';
        
                // Skills
                const skillName = document.getElementById('skillName') ? document.getElementById('skillName').value : '';
        
                // Certificates
                const certificateName = document.getElementById('certificateName') ? document.getElementById('certificateName').value : '';
        
                // Languages
                const languageName = document.getElementById('languageName') ? document.getElementById('languageName').value : '';
                const languageReading = document.getElementById('languageReading') ? document.getElementById('languageReading').value : '';
                const languageWriting = document.getElementById('languageWriting') ? document.getElementById('languageWriting').value : '';
                const languageSpeaking = document.getElementById('languageSpeaking') ? document.getElementById('languageSpeaking').value : '';
        
                return {
                    fatherName,
                    motherName,
                    dob,
                    gender,
                    maritalStatus,
                    nationality,
                    religion,
                    permanentAddress,
                    degree,
                    institution,
                    skillName,
                    certificateName,
                    languageName,
                    languageReading,
                    languageWriting,
                    languageSpeaking,
                };
            }
        
            function updatePreview(section = '') {
                const fullName = document.getElementById('fullName').value;
                const address = document.getElementById('address').value;
                const phoneNumber = document.getElementById('phoneNumber').value;
                const email = document.getElementById('email').value;
                const livePreview = document.getElementById('live-preview');
                const {
                    fatherName,
                    motherName,
                    dob,
                    gender,
                    maritalStatus,
                    nationality,
                    religion,
                    permanentAddress,
                    degree,
                    institution,
                    skillName,
                    certificateName,
                    languageName,
                    languageReading,
                    languageWriting,
                    languageSpeaking,
                } = getData();
        
                // Initialize preview HTML
                let previewHTML = `
                    <div class="text-center">
                        <h4 class="mb-0">CURRICULUM VITAE OF</h4>
                        <h4 class="mb-3">${fullName.toUpperCase()}</h4>
                    </div>
                    <p class="mb-1"><strong>Address&nbsp;:</strong> ${address}</p>
                    <p class="mb-1"><strong>Phone&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:</strong> ${phoneNumber} | Whatsapp | Skype</p>
                    <p class="mb-4"><strong>Email&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:</strong> ${email}</p>
                `;
        
                // Update based on section
                if (visited_sections.includes('personalDetails')) {
                    previewHTML += `
                        ${fatherName || motherName || dob || gender || maritalStatus || nationality || religion || permanentAddress
                            ? `<h5 class="mb-3 p-1 bg-secondary text-dark rectangular"><strong>Personal Details</strong></h5>
                                <table>
                                    ${fatherName ? `<tr><td><strong>Father's Name</strong></td><td>: ${fatherName}</td></tr>` : ''}
                                    ${motherName ? `<tr><td><strong>Mother's Name</strong></td><td>: ${motherName}</td></tr>` : ''}
                                    ${dob ? `<tr><td><strong>Date of Birth</strong></td><td>: ${dob}</td></tr>` : ''}
                                    ${gender ? `<tr><td><strong>Gender</strong></td><td>: ${gender}</td></tr>` : ''}
                                    ${maritalStatus ? `<tr><td><strong>Marital Status</strong></td><td>: ${maritalStatus}</td></tr>` : ''}
                                    ${nationality ? `<tr><td><strong>Nationality</strong></td><td>: ${nationality}</td></tr>` : ''}
                                    ${religion ? `<tr><td><strong>Religion</strong></td><td>: ${religion}</td></tr>` : ''}
                                    ${permanentAddress ? `<tr><td><strong>Permanent Address</strong></td><td>: ${permanentAddress}</td></tr>` : ''}
                                </table>`
                            : ''
                        }
                    `;
                }
        
                if (visited_sections.includes('education')) {
                    previewHTML += `
                        ${degree || institution
                            ? `<h5 class="mb-2 mt-3 p-1 bg-secondary text-dark rectangular"><strong>EDUCATION</strong></h5>
                                <table>
                                    ${degree ? `<tr><td><strong>Degree</strong></td><td>: ${degree}</td></tr>` : ''}
                                    ${institution ? `<tr><td><strong>Institution</strong></td><td>: ${institution}</td></tr>` : ''}
                                </table>
                                <br/>`
                            : ''
                        }
                    `;
                }
        
                if (visited_sections.includes('skills')) {
                    previewHTML += `
                        ${skillName
                            ? `<h5 class="mb-3 p-1 bg-secondary text-dark rectangular"><strong>SKILL</strong></h5>
                                <table>
                                    <tr><td><strong>Skill</strong></td><td>: ${skillName}</td></tr>
                                </table><br/>`
                            : ''
                        }
                    `;
                }
        
                if (visited_sections.includes('certificates')) {
                    previewHTML += `
                        ${certificateName
                            ? `<h5 class="mb-3 p-1 bg-secondary text-dark rectangular"><strong>CERTIFICATIONS</strong></h5>
                                <table>
                                    <tr><td><strong>Certificate</strong></td><td>: ${certificateName}</td></tr>
                                </table><br/>`
                            : ''
                        }
                    `;
                }
        
                if (visited_sections.includes('languages')) {
                    previewHTML += `
                        ${languageName || languageReading || languageWriting || languageSpeaking
                            ? `<h5 class="mb-3 p-1 bg-secondary text-dark rectangular"><strong>LANGUAGE PROFICIENCY</strong></h5>
                                <table class="table table-bordered">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Language</th>
                                            <th>Reading</th>
                                            <th>Writing</th>
                                            <th>Speaking</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>${languageName || 'N/A'}</td>
                                            <td>${languageReading || 'N/A'}</td>
                                            <td>${languageWriting || 'N/A'}</td>
                                            <td>${languageSpeaking || 'N/A'}</td>
                                        </tr>
                                    </tbody>
                                </table><br/>`
                            : ''
                        }
                    `;
                }
        
                // Update the live preview
                livePreview.innerHTML = previewHTML;

            }

            async function exportToPDF() {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();

                const livePreview = document.getElementById('live-preview');
                await pdf.html(livePreview, {
                    callback: (doc) => doc.save('cv.pdf'),
                    x: 15,
                    y: 15,
                    html2canvas: { scale: 2 },
                });
            }

        </script>
        
    </body>
</html>
