<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/Pages/Images/Lasticon.jpeg"  >
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<header class="py-1 bg-light">
  <div class="container-fluid">
    <div class="row align-items-center">
      <!-- Left Section -->
      <div class="col-lg-5">
        <a href="/cv/home" class="text-warning text-decoration-none">
          <img src="/Pages/Images/PIC.jpeg" class="mb-0 img-fluid" style="width: 170px; height: 55px;">

        </a>
      </div>

      <!-- Right Section -->
      <div class="col-lg-7">
        
      </div>
    </div>
  </div>
</header>
<body class="bg-light">
  <main class="container d-flex justify-content-center align-items-center">
    <div class="card shadow" style="max-width: 350px; width: 100%; padding: 2rem;">
      <h2 class="text-center mb-3">Reset Password</h2>
      <form id="resetPasswordForm">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Reset Password</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();

        if (newPassword !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        try {
            const response = await fetch('/cv/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ NewPassword: newPassword })  // ✅ Match the C# property
            });

            if (response.ok) {
                alert('Password reset successful.');
                window.location.href = '/cv/login';
            } else {
                const errorData = await response.json();
                alert(`Error: ${errorData.error || errorData.message}`);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Please try again later.');
        }
    });
</script>

</body>
</html>
