<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/Pages/Images/Lasticon.jpeg" />
    <title>Signup Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Pages/CSS/register.css">
    <link rel="stylesheet" href="/Pages/CSS/loadingscreen.css">
  </head>
  <body class="bg-light">
    <!-- Progress Bar -->
    <div id="progress-bar"></div>
    <div id="progress-bar-validation"></div>
    <div id="loading-overlay"></div>
    <!-- Header -->
    <header class="py-1 fixed-top bg-light">
      <div class="container-fluid">
        <div class="row align-items-center">
          <!-- Left Section -->
          <div class="col-lg-5">
            <a href="/cv/home" class="text-warning text-decoration-none">
              <img
                src="/Pages/Images/PIC.jpeg"
                class="mb-0 img-fluid"
                style="width: 170px; height: 55px;"
              />
            </a>
          </div>

          <!-- Right Section -->
          <div class="col-lg-7"></div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container d-flex justify-content-center align-items-center">
      <div class="card shadow">
        <!-- Logo -->
        <div class="text-center">
          <img
            src="/Pages/Images/Lasticon.jpeg"
            alt="Logo"
            class="rectangle mb-3"
            style="width: 60px; height: 60px"
          />
        </div>

        <!-- Signup Page Text -->
        <h2 class="text-center mb-3">Sign Up Page</h2>

        <!-- Notification Element -->
        <div id="notification" class="notification"></div>

        <!-- Signup Form -->
        <form id="signupForm">
          <!-- Username Input -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>

          <!-- Email Input -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <!-- Confirm Password Input -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            />
          </div>

          <!-- Signup Button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </div>
        </form>

        <!-- Login Option -->
        <div class="text-center mt-4">
          <span>Already have an account?</span>
          <a href="/cv/login" class="text-decoration-none text-primary">Login</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-3">
      <p class="text-center mb-0">
        © 2025 CV/Resume Generator. All Rights Reserved.
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/Pages/Javascripts/LoadingScreen.js"></script>

    <script src="/Pages/Javascripts/register.js"> </script>

   
  </body>
</html>
